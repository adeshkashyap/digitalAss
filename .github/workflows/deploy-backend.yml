name: Deploy Backend

on:
  push:
    branches: [backend]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-1bfab08c-7bd6-4e02-8a5
  REGION: us-central1
  AR_REPO: devassets
  SERVICE: devassets-api
  IMAGE: us-central1-docker.pkg.dev/project-1bfab08c-7bd6-4e02-8a5/devassets/devassets-api
  CORS_ORIGIN: https://apnacodex.com,https://www.apnacodex.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/104655135288/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@project-1bfab08c-7bd6-4e02-8a5.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --set-secrets=DATABASE_URL=devassets-database-url:latest,JWT_SECRET=devassets-jwt-secret:latest \
            --set-env-vars=^@^NODE_ENV=production@CORS_ORIGIN=${CORS_ORIGIN}
